[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "realtime-voice-agent-benchmark"
version = "0.1.0"
description = "Observable, reproducible Chinese realtime voice agent benchmarks"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
qwen = ["websockets>=15,<16"]
assets = ["dashscope==1.27.6"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["benchmark", "events", "scenarios", "adapters", "simulator", "evaluator", "agent", "tools", "reports", "dataset", "renderers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
