kind: text_scenario
schema_version: '0.1'
scenario_id: text_interruption_city_001
scenario_version: 1
mode: full_duplex
category: interruption
language: zh-CN
tags: [clean, text_source, correction]
seed: 17
world:
  now: '2026-09-21T10:00:00+08:00'
  timezone: Asia/Shanghai
session:
  system_prompt: 请用自然、简洁的中文交流。
  turn_mode: server_vad
  control_profile: native_server
tts_profile: qwen3_tts_flash_cherry_16k_v1
actions:
  - action_id: initial
    turn_id: t1
    behavior: utterance
    speech:
      text: 请详细介绍北京适合周末游玩的地方，至少说三个。
    trigger:
      type: session_ready
  - action_id: correction
    turn_id: t2
    behavior: interruption
    intent_revision: 2
    speech:
      text: 等一下，不是北京，我想问上海。
    trigger:
      type: after_event
      event: assistant_playback_start
      where:
        turn_id: t1
      occurrence: 1
      bind:
        target_response_id: response_id
      delay_ms: 350
      timeout_ms: 20000
    preconditions:
      - type: response_still_playing
        response: $target_response_id
      - type: response_still_generating
        response: $target_response_id
      - type: minimum_continuation_evidence
        remaining_ms: 800
oracle:
  hidden_from_model: true
  stimulus: interruption
  expected_new_intent:
    city: 上海
  forbidden_old_intent: {}
  metric_profile: interruption_text_v0_1
  assertions:
    - type: old_response_stops
